name: PLA BNTX 58 native-format final retry
on:
  workflow_dispatch:
  push:
    branches: [feat/pla-astc-trinity-batch]
    paths:
      - 'scripts/audit_pla_bntx_final.py'
      - '.github/workflows/pla-bntx-last58.yml'
permissions:
  contents: read
  actions: read
jobs:
  retry:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pla-last58]')
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, bntx: 2989, missing: 2}
          - {shard: 1, bntx: 3616, missing: 49}
          - {shard: 2, bntx: 2318, missing: 2}
          - {shard: 3, bntx: 2980, missing: 5}
    steps:
      - uses: actions/checkout@v4
        with:
          path: PLA
          sparse-checkout: |
            tools/PLA.Bntx.Export/
            scripts/convert_pla_bntx.py
      - uses: actions/checkout@v4
        with:
          repository: 969981/SV_Resources
          ref: 50307e4227e74d59d0f3f32e08f99125be80b34b
          path: SV
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/gftool/NxMiddleware/BnTxx/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned BnTxx native BC6H HDR decoder
        shell: pwsh
        run: |
          $root = Join-Path (Get-Location) "SV/tools/gftool/NxMiddleware/BnTxx"
          dotnet build "PLA/tools/PLA.Bntx.Export/PLA.Bntx.Export.csproj" -c Release "-p:BnTxxRoot=$root"
      - uses: actions/download-artifact@v4
        with:
          name: pla-bntx-retry-shard-${{ matrix.shard }}
          repository: 969981/PLA_Resources
          run-id: 42170751780
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: PLA/.pla-work/previous
      - uses: actions/download-artifact@v4
        with:
          name: pla-gfpak-extracted-shard-${{ matrix.shard }}
          repository: 969981/PLA_Resources
          run-id: 42160235620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: PLA/.pla-work/extracted
      - name: Decode only remaining native partial 58 with BC6H floating point preservation
        shell: pwsh
        run: |
          python PLA/scripts/convert_pla_bntx.py --root PLA/.pla-work/extracted --dest PLA/.pla-work/final-png --cli PLA/tools/PLA.Bntx.Export/bin/Release/net10.0-windows/PLA.Bntx.Export.dll --only-previous-partial PLA/.pla-work/previous/retry-shard-${{ matrix.shard }}.jsonl --expected-bntx ${{ matrix.bntx }} --expected-selected ${{ matrix.missing }} --jobs 2 --strict --ledger PLA/.pla-work/ledger/final-shard-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-bntx-final-shard-${{ matrix.shard }}
          path: PLA/.pla-work/ledger/final-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-bntx-final-pixels-shard-${{ matrix.shard }}
          path: PLA/.pla-work/final-png/**/converted/**
          if-no-files-found: warn
          retention-days: 14
  aggregate:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pla-last58]'))
    needs: retry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/audit_pla_bntx_final.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: pla-bntx-report-shard-*
          repository: 969981/PLA_Resources
          run-id: 42166291180
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .pla-work/original
      - uses: actions/download-artifact@v4
        with:
          pattern: pla-bntx-retry-shard-*
          repository: 969981/PLA_Resources
          run-id: 42170751780
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .pla-work/first
      - uses: actions/download-artifact@v4
        with:
          pattern: pla-bntx-final-shard-*
          path: .pla-work/final
      - name: Prove complete source ledger for 11903 BNTX files across three passes
        run: |
          python scripts/audit_pla_bntx_final.py --original .pla-work/original --first-retry .pla-work/first --final-retry .pla-work/final --out .pla-work/coverage/bntx-final.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-bntx-final-full-coverage
          path: .pla-work/coverage/bntx-final.json
          if-no-files-found: warn
          retention-days: 14
