name: PLA 1.1.1 Ghidra 12.2 full analysis

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pla-ghidra-full.yml'

permissions:
  contents: read

concurrency:
  group: pla-v111-ghidra12-full
  cancel-in-progress: false

jobs:
  analyze:
    name: Full AArch64 Ghidra analysis, SQLite and C
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ELF: Unpack/v1.1.1/exefs/main/main.elf
      ELF_SHA256: 260bd03043d6f147723739fe350230f6fac8a9cc49f59ae18e1af0757c4b6794
      GHIDRA_RELEASE_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_RELEASE_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
    steps:
      - name: Sparse checkout actual PLA ELF and Ghidra exporters
        uses: actions/checkout@v4
        with:
          ref: master
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Unpack/v1.1.1/exefs/main/main.elf
            /Unpack/v1.1.1/exefs/main/main.elf.manifest.json
            /tools/ghidra/
            /.github/workflows/pla-ghidra-full.yml

      - name: Install JDK 25 required by official Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify source identity and exporter syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ELF"
          printf '%s  %s\n' "$ELF_SHA256" "$ELF" | sha256sum --check
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads(Path('Unpack/v1.1.1/exefs/main/main.elf.manifest.json').read_text())
          assert doc['state']=='VERIFIED' and doc['elf_sha256']==os.environ['ELF_SHA256']
          assert doc['elf_header']['machine']=='AArch64'
          PY
          readelf -h "$ELF" | grep -E 'ELF64|AArch64|Machine:'
          python3 -m py_compile tools/ghidra/pla_build_sqlite.py tools/ghidra/pla_extract_c.py tools/ghidra/pla_publish_split.py tools/ghidra/pla_restore_split.py
          mkdir -p "$RUNNER_TEMP/pla_ghidra_dist" "$RUNNER_TEMP/pla_ghidra_work" "$RUNNER_TEMP/pla_ghidra_out"
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi

      - name: Install pinned official Ghidra 12.2 distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.2_PUBLIC_20261016.zip"
          curl --fail --location --retry 4 --retry-delay 10 --output "$archive" "$GHIDRA_RELEASE_URL"
          printf '%s  %s\n' "$GHIDRA_RELEASE_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/pla_ghidra_dist"
          analyzer="$(find "$RUNNER_TEMP/pla_ghidra_dist" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$analyzer"
          chmod +x "$analyzer"
          echo "GHIDRA_HEADLESS=$analyzer" >> "$GITHUB_ENV"
          rm -f "$archive"

      - name: Import original ELF, analyze whole program and decompile every discovered function
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=40s 325m \
            "$GHIDRA_HEADLESS" "$RUNNER_TEMP/pla_ghidra_work" PLA111 \
              -import "$GITHUB_WORKSPACE/$ELF" \
              -scriptPath "$GITHUB_WORKSPACE/tools/ghidra" \
              -analysisTimeoutPerFile 15000 \
              -max-cpu 2 \
              -postScript PLAExport.java \
                "$RUNNER_TEMP/pla_ghidra_out/pla_events.ndjson.gz" all 20 \
              -log "$RUNNER_TEMP/pla_ghidra_out/pla_ghidra_headless.log" \
              -scriptlog "$RUNNER_TEMP/pla_ghidra_out/pla_ghidra_script.log" \
            2>&1 | tee "$RUNNER_TEMP/pla_ghidra_out/pla_ghidra_console.log"
          test -s "$RUNNER_TEMP/pla_ghidra_out/pla_events.ndjson.gz"
          test -f "$RUNNER_TEMP/pla_ghidra_work/PLA111.gpr"
          test -d "$RUNNER_TEMP/pla_ghidra_work/PLA111.rep"

      - name: Build complete indexed SQLite and reconcile counts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_build_sqlite.py \
            --game pla --elf "$ELF" \
            --input "$RUNNER_TEMP/pla_ghidra_out/pla_events.ndjson.gz" \
            --out "$RUNNER_TEMP/pla_ghidra_out/pla.sqlite" \
            --report "$RUNNER_TEMP/pla_ghidra_out/pla_sqlite_manifest.json"
          python3 - "$RUNNER_TEMP/pla_ghidra_out/pla.sqlite" "$RUNNER_TEMP/pla_ghidra_out/pla_sqlite_manifest.json" <<'PY'
          import json,sqlite3,sys
          m=json.load(open(sys.argv[2]))
          assert m['status']=='COMPLETE' and m['decompile_requested'],m
          with sqlite3.connect(sys.argv[1]) as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              assert db.execute('SELECT COUNT(*) FROM functions').fetchone()[0]>0
              assert db.execute('SELECT COUNT(*) FROM instructions').fetchone()[0]>0
              assert db.execute('SELECT COUNT(*) FROM decompilation').fetchone()[0]==db.execute('SELECT COUNT(*) FROM functions').fetchone()[0]
          print('PLA Ghidra SQL verified:',m['counts'])
          PY

      - name: Extract each C pseudocode and every unsuccessful status
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_extract_c.py \
            --input "$RUNNER_TEMP/pla_ghidra_out/pla_events.ndjson.gz" \
            --zip "$RUNNER_TEMP/pla_ghidra_out/pla_all_c.zip" \
            --index "$RUNNER_TEMP/pla_ghidra_out/pla_decompiled_index.csv" \
            --report "$RUNNER_TEMP/pla_ghidra_out/pla_decompiled_manifest.json" \
            --elf-sha "$ELF_SHA256"
          python3 - "$RUNNER_TEMP/pla_ghidra_out/pla_decompiled_manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['decompiler_attempted']==m['functions'] and m['functions']>0,m
          assert m['c_success']>0 and m['c_success']+m['c_fail_or_empty']==m['functions'],m
          print('PLA:',m['functions'],'attempts;',m['c_success'],'C recovered;',m['c_fail_or_empty'],'non-C outcomes')
          PY

      - name: Preserve editable Ghidra native project
        shell: bash
        run: |
          set -euo pipefail
          tar -I 'zstd -T2 -5' -C "$RUNNER_TEMP/pla_ghidra_work" \
            -cf "$RUNNER_TEMP/pla_ghidra_out/pla_ghidra_project.tar.zst" PLA111.gpr PLA111.rep
          test -s "$RUNNER_TEMP/pla_ghidra_out/pla_ghidra_project.tar.zst"
          cat "$RUNNER_TEMP/pla_ghidra_out/pla_sqlite_manifest.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/pla_ghidra_out/pla_decompiled_manifest.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload original editable project
        uses: actions/upload-artifact@v4
        with:
          name: PLA-pla-project
          path: ${{ runner.temp }}/pla_ghidra_out/pla_ghidra_project.tar.zst
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload SQLite and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: PLA-pla-sqlite
          path: |
            ${{ runner.temp }}/pla_ghidra_out/pla.sqlite
            ${{ runner.temp }}/pla_ghidra_out/pla_sqlite_manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload all real decompiled C and index of failures
        uses: actions/upload-artifact@v4
        with:
          name: PLA-pla-c
          path: |
            ${{ runner.temp }}/pla_ghidra_out/pla_all_c.zip
            ${{ runner.temp }}/pla_ghidra_out/pla_decompiled_index.csv
            ${{ runner.temp }}/pla_ghidra_out/pla_decompiled_manifest.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload full NDJSON event database
        uses: actions/upload-artifact@v4
        with:
          name: PLA-pla-ndjson
          path: ${{ runner.temp }}/pla_ghidra_out/pla_events.ndjson.gz
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload diagnostics whether successful or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLA-pla-diagnostics
          path: |
            ${{ runner.temp }}/pla_ghidra_out/pla_ghidra_headless.log
            ${{ runner.temp }}/pla_ghidra_out/pla_ghidra_script.log
            ${{ runner.temp }}/pla_ghidra_out/pla_ghidra_console.log
          retention-days: 30
          if-no-files-found: warn
