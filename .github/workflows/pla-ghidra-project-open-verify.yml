name: PLA 1.1.1 Ghidra 12.2 native project restore and open verification

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pla-ghidra-project-open-verify.yml'
  workflow_run:
    workflows:
      - PLA 1.1.1 publish verified Ghidra split database and C
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: pla-v111-ghidra-native-project-verify
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == '969981/PLA_Resources' && (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    name: Restore all native project shards and open in Ghidra 12.2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPO: 969981/PLA_Resources
      ANALYSIS_RUN: '42774682950'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GHIDRA_RELEASE_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip
      GHIDRA_RELEASE_SHA256: 2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67
      SOURCE: derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla
    steps:
      - name: Sparse checkout only native Ghidra project and its split shards
        uses: actions/checkout@v4
        with:
          ref: master
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ghidra/pla_restore_split.py
            /tools/ghidra/pla_embed_elf.py
            /.github/workflows/pla-ghidra-project-open-verify.yml
            /derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla/parts_manifest.json
            /derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla/project/
            /derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla/project_parts/

      - name: Verify original successful analysis and restore script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$ANALYSIS_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$ANALYSIS_RUN" --jq '.name')" = "PLA 1.1.1 Ghidra 12.2 full analysis"
          python3 -m py_compile tools/ghidra/pla_restore_split.py tools/ghidra/pla_embed_elf.py
          test -s "$SOURCE/parts_manifest.json"

      - name: Reassemble native Ghidra project and verify every split SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_restore_split.py \
            --source "$SOURCE" \
            --out "$RUNNER_TEMP/pla_project_restored" \
            --project-only | tee "$RUNNER_TEMP/pla_project_restore_stdout.json"
          python3 - "$RUNNER_TEMP/pla_project_restored/restore_report.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['status']=='NATIVE_PROJECT_REASSEMBLED_AND_SHA256_VERIFIED',m
          assert m['native_project'] is True,m
          assert m['project_name']=='PLA111',m
          assert m['project_split_files']==1,m
          print('Native project shard verification passed:',m)
          PY
          test -f "$RUNNER_TEMP/pla_project_restored/project/PLA111.gpr"
          test -d "$RUNNER_TEMP/pla_project_restored/project/PLA111.rep"

      - name: Install JDK 25 required by official Ghidra 12.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download and verify pinned official Ghidra 12.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.2_PUBLIC_20261016.zip"
          mkdir -p "$RUNNER_TEMP/ghidra_dist"
          curl --fail --location --retry 4 --retry-delay 10 --output "$archive" "$GHIDRA_RELEASE_URL"
          printf '%s  %s\n' "$GHIDRA_RELEASE_SHA256" "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/ghidra_dist"
          analyzer="$(find "$RUNNER_TEMP/ghidra_dist" -type f -path '*/support/analyzeHeadless' -print -quit)"
          test -n "$analyzer"
          chmod +x "$analyzer"
          echo "GHIDRA_HEADLESS=$analyzer" >> "$GITHUB_ENV"
          rm -f "$archive"

      - name: Open restored PLA111 project read-only without reanalysis
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/PLAProjectOpenVerify.java" <<'JAVA'
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.Function;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.util.Iterator;

          public class PLAProjectOpenVerify extends GhidraScript {
              @Override
              protected void run() throws Exception {
                  if (currentProgram == null) {
                      throw new IllegalStateException("Ghidra did not open a program");
                  }
                  Iterator<Function> functions = currentProgram.getFunctionManager().getFunctions(true);
                  long count = 0;
                  while (functions.hasNext()) {
                      functions.next();
                      count++;
                  }
                  String programName = currentProgram.getName();
                  String imageBase = currentProgram.getImageBase().toString();
                  String[] args = getScriptArgs();
                  if (args == null || args.length != 1) {
                      throw new IllegalArgumentException("Expected one report output path");
                  }
                  String report = "{\n" +
                      "  \"status\": \"OPENED_READ_ONLY\",\n" +
                      "  \"program\": \"" + programName + "\",\n" +
                      "  \"image_base\": \"" + imageBase + "\",\n" +
                      "  \"function_count\": " + count + "\n" +
                      "}\n";
                  Files.write(Paths.get(args[0]), report.getBytes(StandardCharsets.UTF_8));
                  println(report);
                  if (!"main.elf".equals(programName)) {
                      throw new IllegalStateException("Unexpected program name: " + programName);
                  }
                  if (!"00100000".equals(imageBase)) {
                      throw new IllegalStateException("Unexpected image base: " + imageBase);
                  }
                  if (count != 82760L) {
                      throw new IllegalStateException("Expected 82760 functions, found " + count);
                  }
              }
          }
          JAVA
          "$GHIDRA_HEADLESS" "$RUNNER_TEMP/pla_project_restored/project" PLA111 \
            -process main.elf -noanalysis -readOnly \
            -scriptPath "$RUNNER_TEMP" \
            -postScript PLAProjectOpenVerify.java "$RUNNER_TEMP/ghidra_project_open_report.json" \
            -log "$RUNNER_TEMP/ghidra_project_open.log" \
            -scriptlog "$RUNNER_TEMP/ghidra_project_open_script.log"
          python3 - "$RUNNER_TEMP/ghidra_project_open_report.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['status']=='OPENED_READ_ONLY',m
          assert m['program']=='main.elf',m
          assert m['image_base']=='00100000',m
          assert m['function_count']==82760,m
          print('Ghidra 12.2 native project open verification passed:',m)
          PY

      - name: Preserve independent native project verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLA-Ghidra12-native-project-open-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/pla_project_restored/restore_report.json
            ${{ runner.temp }}/ghidra_project_open_report.json
            ${{ runner.temp }}/ghidra_project_open.log
            ${{ runner.temp }}/ghidra_project_open_script.log

      - name: Add verification summary
        if: success()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/pla_project_restored/restore_report.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/ghidra_project_open_report.json" >> "$GITHUB_STEP_SUMMARY"
