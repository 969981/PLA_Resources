name: PLA 1.1.1 static semantic candidate inventory

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pla-semantic-inventory.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pla-v111-semantic-inventory
  cancel-in-progress: false

jobs:
  inventory:
    if: github.repository == '969981/PLA_Resources'
    name: Restore SQLite and build evidence-linked semantic candidates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      REPO: 969981/PLA_Resources
      ANALYSIS_RUN: '42774682950'
      PUBLISH_RUN: '42830950371'
      SOURCE: derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla
      OUTPUT: docs/research/v1.1.1/semantic_inventory
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Sparse checkout SQLite shards, manifests and research tools
        uses: actions/checkout@v4
        with:
          ref: master
          filter: blob:none
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ghidra/pla_restore_split.py
            /tools/ghidra/pla_embed_elf.py
            /tools/ghidra/pla_semantic_inventory.py
            /.github/workflows/pla-semantic-inventory.yml
            /docs/research/v1.1.1/
            /derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla/parts_manifest.json
            /derived/v1.1.1/Ghidra_12.2_Run_42774682950/pla/database/

      - name: Verify source analysis and idempotent publication succeeded
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$REPO/actions/runs/$ANALYSIS_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$PUBLISH_RUN" --jq '.conclusion')" = success
          python3 -m py_compile tools/ghidra/pla_restore_split.py tools/ghidra/pla_embed_elf.py tools/ghidra/pla_semantic_inventory.py
          test -s "$SOURCE/parts_manifest.json"

      - name: Restore SQLite only and verify original database identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_restore_split.py \
            --source "$SOURCE" \
            --out "$RUNNER_TEMP/pla_sqlite_restored" \
            --sqlite-only | tee "$RUNNER_TEMP/pla_sqlite_restore_stdout.json"
          python3 - "$RUNNER_TEMP/pla_sqlite_restored/restore_report.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['status']=='SQLITE_REASSEMBLED_AND_SHA256_VERIFIED',m
          assert m['sqlite_integrity']=='ok',m
          assert m['sqlite_counts']['functions']==82760,m
          assert m['sqlite_counts']['decompilation']==82760,m
          assert m['original_elf_chunks']['original_file_sha256']=='260bd03043d6f147723739fe350230f6fac8a9cc49f59ae18e1af0757c4b6794',m
          print('SQLite-only restoration passed:',m)
          PY

      - name: Build static string, RTTI, function and call-graph candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT"
          python3 tools/ghidra/pla_semantic_inventory.py \
            --db "$RUNNER_TEMP/pla_sqlite_restored/pla.sqlite" \
            --out "$OUTPUT" \
            --top-per-domain 250 | tee "$RUNNER_TEMP/pla_semantic_inventory_stdout.json"
          test -s "$OUTPUT/summary.json"
          test -s "$OUTPUT/domain_function_candidates.csv"
          test -s "$OUTPUT/domain_string_xrefs.csv"
          test -s "$OUTPUT/selected_callgraph_edges.csv"
          test -s "$OUTPUT/rtti_vtable_typeinfo_symbols.csv"
          test -s "$OUTPUT/decompilation_failures.csv"

      - name: Commit reproducible semantic inventory to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$OUTPUT"
          git commit -m "research(pla): add evidence-linked static semantic candidate inventory"
          git fetch -q origin master
          git rebase origin/master
          git push origin HEAD:refs/heads/master

      - name: Preserve semantic inventory as an Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLA-1.1.1-semantic-candidate-inventory
          retention-days: 30
          if-no-files-found: warn
          path: |
            docs/research/v1.1.1/semantic_inventory/
            ${{ runner.temp }}/pla_sqlite_restored/restore_report.json
            ${{ runner.temp }}/pla_semantic_inventory_stdout.json
