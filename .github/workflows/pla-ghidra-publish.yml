name: PLA 1.1.1 publish verified Ghidra split database and C

on:
  workflow_run:
    workflows:
      - PLA 1.1.1 Ghidra 12.2 full analysis
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'ID of completed successful PLA Ghidra full analysis run'
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: pla-v111-ghidra12-publish-master
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == '969981/PLA_Resources' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    name: Publish raw SQLite/NDJSON shards and every decompiled function C
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      REPO: 969981/PLA_Resources
      SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Sparse checkout PLA publisher sources
        uses: actions/checkout@v4
        with:
          ref: master
          filter: blob:none
          fetch-depth: 1
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/ghidra/pla_publish_split.py
            /tools/ghidra/pla_restore_split.py
            /tools/ghidra/pla_embed_elf.py
            /Unpack/v1.1.1/exefs/main/main.elf
            /.github/workflows/pla-ghidra-publish.yml
            /derived/v1.1.1/

      - name: Prove successful original run and source identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.name')" = "PLA 1.1.1 Ghidra 12.2 full analysis"
          test "$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN" --jq '.head_branch')" = master
          python3 -m py_compile tools/ghidra/pla_publish_split.py tools/ghidra/pla_restore_split.py tools/ghidra/pla_embed_elf.py
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          echo "DEST=derived/v1.1.1/Ghidra_12.2_Run_$SOURCE_RUN" >> "$GITHUB_ENV"

      - name: Download successful Ghidra artifacts from source run
        shell: bash
        run: |
          set -euo pipefail
          for kind in project sqlite c ndjson; do
            name="PLA-pla-$kind"
            mkdir -p "$RUNNER_TEMP/artifacts/$name"
            gh run download "$SOURCE_RUN" -R "$REPO" --name "$name" \
              --dir "$RUNNER_TEMP/artifacts/$name"
            test -n "$(find "$RUNNER_TEMP/artifacts/$name" -type f -print -quit)"
            du -sh "$RUNNER_TEMP/artifacts/$name"
          done

      - name: Embed and verify complete original ELF bytes inside SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_embed_elf.py \
            --elf Unpack/v1.1.1/exefs/main/main.elf \
            --db "$RUNNER_TEMP/artifacts/PLA-pla-sqlite/pla.sqlite" \
            --report "$RUNNER_TEMP/artifacts/PLA-pla-sqlite/pla_elf_bytes_manifest.json"

      - name: Validate and create lossless SQLite/NDJSON shards, C and Ghidra project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$DEST/pla/parts_manifest.json" ]; then
            # Idempotent recovery: reuse an already verified publication.
            python3 - "$DEST/pla/parts_manifest.json" "$SOURCE_RUN" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["status"]=="UNCOMPRESSED_SPLIT_VERIFIED",m
          assert str(m["source_run_id"])==sys.argv[2],m
          assert m["original_elf_sha256"]=="260bd03043d6f147723739fe350230f6fac8a9cc49f59ae18e1af0757c4b6794",m
          PY
          elif [ -e "$DEST" ]; then
            echo "::error::Destination exists without a verified manifest; refusing to overwrite"
            exit 1
          else
            python3 tools/ghidra/pla_publish_split.py \
              --artifacts "$RUNNER_TEMP/artifacts" \
              --out "$DEST" --run-id "$SOURCE_RUN"
          fi
          # Publish the standalone ELF proof as well as embedding it in parts_manifest.
          python3 - "$DEST/pla/parts_manifest.json" "$DEST/pla/elf_bytes_manifest.json" "$RUNNER_TEMP/artifacts/PLA-pla-sqlite/pla_elf_bytes_manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          expected=m["original_elf_chunks"]
          artifact=json.load(open(sys.argv[3]))
          assert expected==artifact,(expected,artifact)
          with open(sys.argv[2],"w") as out:
              json.dump(expected,out,indent=2)
              out.write("\\n")
          PY
          python3 - "$DEST/pla/parts_manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['status']=='UNCOMPRESSED_SPLIT_VERIFIED',m
          assert m['sqlite_counts']['functions']>0
          assert m['c_success']+m['c_failed_or_empty']==m['decompiler_attempted'],m
          assert m['sqlite_counts']['functions']==m['decompiler_attempted'],m
          assert m['c_success']>0
          assert m['original_elf_sha256']=='260bd03043d6f147723739fe350230f6fac8a9cc49f59ae18e1af0757c4b6794'
          print('PLA native, indexed SQLite, whole-line NDJSON and C verified:',m['sqlite_counts'],m['c_success'])
          PY

      - name: Restore byte-identical raw databases and verify SQLite integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ghidra/pla_restore_split.py \
            --source "$DEST/pla" \
            --out "$RUNNER_TEMP/pla_restored" --no-project
          python3 - "$RUNNER_TEMP/pla_restored/restore_report.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['status']=='REASSEMBLED_AND_SHA256_VERIFIED',m
          assert m['sqlite_integrity']=='ok',m
          assert m['sqlite_counts']['functions']>0
          print(m)
          PY

      - name: Publish validated SQLite/NDJSON, native project, index and manifests first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_batch() {
            local label="$1"
            if git diff --cached --quiet; then return; fi
            git commit -m "$label"
            git fetch -q origin master
            git rebase origin/master
            git push origin HEAD:refs/heads/master
          }
          for item in \
            "$DEST/README.md" "$DEST/pla/README.md" \
            "$DEST/pla/parts_manifest.json" \
            "$DEST/pla/elf_bytes_manifest.json" \
            "$DEST/pla/sqlite_manifest.json" \
            "$DEST/pla/decompiled_manifest.json" \
            "$DEST/pla/decompiled_index.csv" \
            "$DEST/pla/project" "$DEST/pla/project_parts" \
            "$DEST/pla/database" "$DEST/pla/ndjson"; do
            if [ -e "$item" ]; then git add --sparse -f -- "$item"; fi
          done
          commit_batch "data(pla): Ghidra 12.2 verified native project, byte-exact SQLite/NDJSON shards and coverage"
          echo "Published validated native project and structured data." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit individual decompiled C pseudocode in bounded batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["c_success"])' "$DEST/pla/parts_manifest.json")"
          tracked_count="$(git ls-tree -r --name-only HEAD -- "$DEST/pla/c" | awk '/\\.c$/ { n++ } END { print n+0 }')"
          if (( tracked_count > expected )); then
            echo "::error::More tracked C files than the verified export: $tracked_count > $expected"
            exit 1
          fi
          if (( tracked_count == expected )); then
            echo "All $expected per-function C files are already committed; checking cleanliness."
            remaining="$(git status --porcelain -- "$DEST")"
            if [ -n "$remaining" ]; then printf '%s\\n' "$remaining"; exit 1; fi
            echo "Verified all $expected per-function C files already exist in Git." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/artifacts/PLA-pla-c/pla_all_c.zip" "$DEST/pla/c" "$expected" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"tools/ghidra")
          from pla_publish_split import unpack_code
          print("Recovered C files:",unpack_code(Path(sys.argv[1]),Path(sys.argv[2]),int(sys.argv[3])))
          PY
          mapfile -d '' -t paths < <(find "$DEST/pla/c" -type f -name '*.c' -print0 | sort -z)
          test "${#paths[@]}" -eq "$expected"
          batch=0
          staged_count=0
          staged_bytes=0
          commit_batch() {
            if git diff --cached --quiet; then return; fi
            batch=$((batch+1))
            git commit -m "data(pla): Ghidra 12.2 decompiled per-function C batch $batch from run $SOURCE_RUN"
            git fetch -q origin master
            git rebase origin/master
            git push origin HEAD:refs/heads/master
            echo "Published batch $batch: $staged_count files, $staged_bytes bytes"
            staged_count=0
            staged_bytes=0
          }
          for path in "${paths[@]}"; do
            size="$(stat -c %s "$path")"
            if (( size > 45 * 1024 * 1024 )); then
              echo "::error::Oversized C blob: $path"
              exit 1
            fi
            if (( staged_count >= 500 || staged_bytes + size > 190 * 1024 * 1024 )); then
              commit_batch
            fi
            git add --sparse -f -- "$path"
            staged_count=$((staged_count+1))
            staged_bytes=$((staged_bytes+size))
          done
          commit_batch
          tracked_count="$(git ls-tree -r --name-only HEAD -- "$DEST/pla/c" | awk '/\\.c$/ { n++ } END { print n+0 }')"
          test "$tracked_count" -eq "$expected"
          remaining="$(git status --porcelain -- "$DEST")"
          if [ -n "$remaining" ]; then printf '%s\\n' "$remaining"; exit 1; fi
          echo "Published and verified $tracked_count per-function C files in $batch new commits." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve publication evidence for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLA-Ghidra12-publication-verification
          retention-days: 30
          if-no-files-found: warn
          path: |
            derived/v1.1.1/Ghidra_12.2_Run_*/pla/parts_manifest.json
            ${{ runner.temp }}/pla_restored/restore_report.json
