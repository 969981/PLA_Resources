name: PLA exact Trinity native path hash recovery

on:
  workflow_dispatch:
  push:
    branches: [feat/pla-secondary-format-census]
    paths:
      - 'scripts/recover_pla_model_hashes.py'
      - 'tests/test_pla_model_hashes.py'
      - '.github/workflows/pla-model-hash-recovery.yml'

permissions:
  actions: read
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/recover_pla_model_hashes.py
            tests/test_pla_model_hashes.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate real native PLA Pikachu hash examples
        run: python -m unittest discover -s tests -p test_pla_model_hashes.py -v
      - uses: actions/download-artifact@v4
        with:
          pattern: pla-member-census-shard-*
          repository: 969981/PLA_Resources
          run-id: 42165327417
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .pla-work/census
      - name: Recover only FNV64-confirmed Trinity paths
        run: |
          python scripts/recover_pla_model_hashes.py --csv \
            .pla-work/census/pla-member-census-shard-0/members.csv \
            .pla-work/census/pla-member-census-shard-1/members.csv \
            .pla-work/census/pla-member-census-shard-2/members.csv \
            .pla-work/census/pla-member-census-shard-3/members.csv \
            --out .pla-work/recovered --min-confirmed 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-trinity-confirmed-path-hashes
          path: .pla-work/recovered/
          retention-days: 14
          if-no-files-found: warn
