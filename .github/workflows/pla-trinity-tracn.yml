name: PLA real TRACN animation reference member parser
on:
  workflow_dispatch:
  push:
    branches: [feat/pla-astc-trinity-batch]
    paths:
      - 'scripts/recover_pla_trinity_animation_files.py'
      - '.github/workflows/pla-trinity-tracn.yml'
permissions:
  contents: read
  actions: read
jobs:
  validate-pikachu-tracn:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pla-tracn]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/recover_pla_model_hashes.py
            scripts/recover_pla_trinity_animation_files.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pla-trinity-animation-reference-catalog
          repository: 969981/PLA_Resources
          run-id: 42171060361
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .pla-work/catalog
      - uses: actions/download-artifact@v4
        with:
          name: pla-gfpak-real-samples
          repository: 969981/PLA_Resources
          run-id: 42160235620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .pla-work/native
      - name: Parse actual Pokemon TRACN FlatBuffer and restore hash verified child resources
        run: |
          python scripts/recover_pla_trinity_animation_files.py --root .pla-work/native --catalog .pla-work/catalog/pla-animation-path-catalog.json --out .pla-work/trinity-animations --report .pla-work/animation-links.json --min-matches 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-pikachu-tracn-native-children
          path: |
            .pla-work/animation-links.json
            .pla-work/trinity-animations/**
          retention-days: 14
          if-no-files-found: warn

# Validate actual TRACN animation child references by hash and native source SHA.
