name: PLA all 356 native Trinity model geometry glTF batch
on:
  workflow_dispatch:
  push:
    branches: [feat/pla-astc-trinity-batch]
    paths:
      - 'scripts/batch_pla_trinity_gltf.py'
      - 'scripts/materialize_pla_trinity.py'
      - '.github/workflows/pla-trinity-gltf-batch.yml'
permissions:
  contents: read
  actions: read
jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pla-trinity-batch]')
    runs-on: windows-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, models: 84}
          - {shard: 1, models: 91}
          - {shard: 2, models: 91}
          - {shard: 3, models: 90}
    steps:
      - uses: actions/checkout@v4
        with:
          path: PLA
          sparse-checkout: |
            scripts/recover_pla_model_hashes.py
            scripts/materialize_pla_trinity.py
            scripts/batch_pla_trinity_gltf.py
      - uses: actions/checkout@v4
        with:
          repository: 969981/SV_Resources
          ref: 50307e4227e74d59d0f3f32e08f99125be80b34b
          path: SV
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/gftool/
            tools/SV.R3.ModelExport/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: pla-gfpak-extracted-shard-${{ matrix.shard }}
          repository: 969981/PLA_Resources
          run-id: 42160235620
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: PLA/.pla-work/native
      - name: Recover real native model/material/mesh/skin file names with SHA256 evidence
        shell: pwsh
        run: |
          python PLA/scripts/materialize_pla_trinity.py --root "PLA/.pla-work/native" --out "PLA/.pla-work/trinity" --report "PLA/.pla-work/model-map-shard-${{ matrix.shard }}.json" --min-models ${{ matrix.models }}
      - name: Build pinned headless Trinity glTF exporter
        shell: pwsh
        run: |
          dotnet build SV/tools/SV.R3.ModelExport/SV.R3.ModelExport.csproj -c Release
      - name: Parallel genuine model geometry, material and skin export with roundtrip validation
        shell: pwsh
        run: |
          python PLA/scripts/batch_pla_trinity_gltf.py --root "PLA/.pla-work/trinity" --out "PLA/.pla-work/gltf" --exe "SV/tools/SV.R3.ModelExport/bin/Release/net10.0-windows/SV.R3.ModelExport.dll" --expected-models ${{ matrix.models }} --jobs 3 --strict --ledger "PLA/.pla-work/ledger/trinity-shard-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pla-trinity-gltf-shard-${{ matrix.shard }}
          path: |
            PLA/.pla-work/model-map-shard-${{ matrix.shard }}.json
            PLA/.pla-work/ledger/trinity-shard-${{ matrix.shard }}.jsonl
            PLA/.pla-work/gltf/**
          retention-days: 14
          if-no-files-found: warn

# Four model shards derived from verified native source census (84/91/91/90).
